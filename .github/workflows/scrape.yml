# Ежедневное обновление public/schedule.json с timetable.bsufl.by (запускается и вручную).
name: Обновление расписания

on:
  schedule:
    - cron: "0 4 * * *" # раз в сутки, 04:00 UTC (07:00 по Минску)
  workflow_dispatch: # ручной запуск

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Установка зависимостей
        run: pip install -r scraper/requirements.txt

      - name: Запуск парсера
        run: python scraper/scrape.py

      - name: Коммит, если расписание изменилось
        run: |
          if [ -n "$(git status --porcelain public/schedule.json)" ]; then
            git config user.name "schedule-bot"
            git config user.email "schedule-bot@users.noreply.github.com"
            git add public/schedule.json
            git commit -m "Обновление расписания"
            git push
          else
            echo "Расписание не изменилось."
          fi
