name: Деплой на GitHub Pages

on:
  push:
    branches: [main]
  # Коммиты от scrape.yml сделаны через GITHUB_TOKEN и сами по себе деплой не запускают,
  # поэтому после каждого запуска парсера запускаем деплой явно. Деплой нужен и после сбоя
  # парсера: так на сайт попадает public/status.json с предупреждением.
  workflow_run:
    workflows: ["Обновление расписания"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка зависимостей
        working-directory: web
        run: npm ci

      - name: Сборка
        working-directory: web
        env:
          # Конфиг веб-приложения Firebase (не секретный, но по правилам проекта хранится в Secrets)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE: default
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
